# Generates the "packet sniffer" that eats the contribution graph (Logs hop in README.md).
# Output is pushed to the `output` branch and loaded from raw.githubusercontent.com.
name: sniffer

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sniffer.svg?color_snake=#c6ff00&color_dots=#1a1a1a,#3d4f00,#6b8a00,#9ccc00,#c6ff00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
